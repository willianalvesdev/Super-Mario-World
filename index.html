<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="Super Mario World original no navegador.">
  <title>Super Mario World</title>
  <link rel="icon" href="assets/mario-world.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main id="game" aria-label="Super Mario World"></main>
  <section class="error" id="error" role="alert" hidden>
    <h1>Não foi possível iniciar o jogo.</h1>
    <p id="error-message"></p>
    <button type="button" id="retry">Recarregar página</button>
  </section>
  <noscript>Ative o JavaScript no navegador para jogar.</noscript>
</body>
</html>
